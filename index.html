<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>违禁词库</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ===== THEME VARIABLES ===== */
:root{
  --bg:#f0f0f5;
  --bg-panel:#ffffff;
  --bg-panel2:#fafafa;
  --bg-hover:#f5f5f7;
  --bg-hover2:#ececec;
  --text:#1d1d1f;
  --text-muted:#6e6e73;
  --text-muted2:#aeaeb2;
  --border:#e8e8ed;
  --border2:#e0e0e8;
  --border3:#d2d2d7;
  --sidebar-active:#eef4ff;
  --topbar:#1d1d1f;
  --topbar-text:#f5f5f7;
  --modal-bg:#ffffff;
  --modal-overlay:rgba(0,0,0,.35);
  --exp-menu-bg:#ffffff;
  --exp-item-hover:#f5f5f7;
  --row-card:#ffffff;
  --rec-table-bg:#ffffff;
  --rec-th-bg:#f5f5f7;
  --no-hit-row:#ffffff;
  --drop-zone-bg:#fafafa;
  --textarea-bg:#fafafa;
  --tooltip-bg:#333333;
  --cnt-bg:#f5f5f7;
  --cnt-active-bg:#dce9ff;
  --scan-left:#ffffff;
  --rec-toolbar-bg:#ffffff;
}
html[data-theme="dark"]{
  --bg:#111113;
  --bg-panel:#1c1c1e;
  --bg-panel2:#2c2c2e;
  --bg-hover:#2c2c2e;
  --bg-hover2:#3a3a3c;
  --text:#f5f5f7;
  --text-muted:#8e8e93;
  --text-muted2:#636366;
  --border:#3a3a3c;
  --border2:#3a3a3c;
  --border3:#48484a;
  --sidebar-active:#1a2d4a;
  --topbar:#000000;
  --topbar-text:#f5f5f7;
  --modal-bg:#2c2c2e;
  --modal-overlay:rgba(0,0,0,.6);
  --exp-menu-bg:#2c2c2e;
  --exp-item-hover:#3a3a3c;
  --row-card:#1c1c1e;
  --rec-table-bg:#1c1c1e;
  --rec-th-bg:#2c2c2e;
  --no-hit-row:#1c1c1e;
  --drop-zone-bg:#2c2c2e;
  --textarea-bg:#2c2c2e;
  --tooltip-bg:#e0e0e5;
  --cnt-bg:#2c2c2e;
  --cnt-active-bg:#1a2d4a;
  --scan-left:#1c1c1e;
  --rec-toolbar-bg:#1c1c1e;
}
@media(prefers-color-scheme:dark){
  html[data-theme="system"]{
    --bg:#111113;
    --bg-panel:#1c1c1e;
    --bg-panel2:#2c2c2e;
    --bg-hover:#2c2c2e;
    --bg-hover2:#3a3a3c;
    --text:#f5f5f7;
    --text-muted:#8e8e93;
    --text-muted2:#636366;
    --border:#3a3a3c;
    --border2:#3a3a3c;
    --border3:#48484a;
    --sidebar-active:#1a2d4a;
    --topbar:#000000;
    --topbar-text:#f5f5f7;
    --modal-bg:#2c2c2e;
    --modal-overlay:rgba(0,0,0,.6);
    --exp-menu-bg:#2c2c2e;
    --exp-item-hover:#3a3a3c;
    --row-card:#1c1c1e;
    --rec-table-bg:#1c1c1e;
    --rec-th-bg:#2c2c2e;
    --no-hit-row:#1c1c1e;
    --drop-zone-bg:#2c2c2e;
    --textarea-bg:#2c2c2e;
    --tooltip-bg:#e0e0e5;
    --cnt-bg:#2c2c2e;
    --cnt-active-bg:#1a2d4a;
    --scan-left:#1c1c1e;
    --rec-toolbar-bg:#1c1c1e;
  }
}
/* dark mode tooltip color flip */
html[data-theme="dark"] mark.hit:hover::after,
html[data-theme="system"] mark.hit:hover::after{color:#111113}
@media(prefers-color-scheme:light){html[data-theme="system"] mark.hit:hover::after{color:#fff}}
/* theme button */
.theme-btn{
  padding:5px 10px;border-radius:7px;border:1.5px solid rgba(255,255,255,.28);
  background:transparent;color:var(--topbar-text);font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:all .15s;user-select:none;
  display:flex;align-items:center;gap:4px;
}
.theme-btn:hover{background:rgba(255,255,255,.12)}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* topbar */
.topbar{background:var(--topbar);color:var(--topbar-text);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;z-index:10}
.topbar h1{font-size:15px;font-weight:700;white-space:nowrap;margin-right:2px}
.page-tabs{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:20px;padding:3px}
.ptab{padding:5px 13px;border-radius:16px;border:none;font-size:12.5px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);transition:all .15s;white-space:nowrap}
.ptab.active{background:var(--bg-panel);color:var(--text)}
.ptab .pbadge{display:inline-block;background:#ff3b30;color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;margin-left:3px;vertical-align:middle;font-weight:700}
.sheet-tabs{display:flex;gap:3px}
.stab{padding:5px 12px;border-radius:13px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.12);color:var(--topbar-text);transition:all .15s}
.stab.active{background:#0071e3;color:#fff}
.stab:hover:not(.active){background:rgba(255,255,255,.22)}
.search-wrap{flex:1;min-width:100px;max-width:220px;position:relative}
.search-wrap input{width:100%;padding:6px 10px 6px 26px;border-radius:13px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:13px;outline:none}
.search-wrap input::placeholder{color:rgba(255,255,255,.4)}
.search-wrap input:focus{background:rgba(255,255,255,.22)}
.sico{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}
.tb-sp{flex:1;min-width:4px}
.tbadge{font-size:12px;color:rgba(255,255,255,.35);white-space:nowrap}
.tb-btn{padding:6px 12px;border-radius:7px;border:1.5px solid rgba(255,255,255,.22);background:transparent;color:var(--topbar-text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.exp-wrap{position:relative}
.exp-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-panel);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;min-width:160px;z-index:300;display:none}
.exp-menu.open{display:block}
.exp-item{padding:10px 15px;font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px}
.exp-item:hover{background:var(--bg-hover)}

/* layout */
.body-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:205px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--border2);overflow-y:auto;padding:5px 0}
.si-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent;transition:background .1s}
.si-item:hover{background:var(--bg-hover)}
.si-item.active{background:var(--sidebar-active);border-left-color:#0071e3}
.si-cat{font-size:12.5px;font-weight:500;flex:1;margin-right:4px;word-break:break-all;line-height:1.35}
.si-item.active .si-cat{color:#0071e3;font-weight:700}
.cnt{font-size:11px;color:var(--text-muted2);background:var(--bg-hover);padding:2px 5px;border-radius:7px;flex-shrink:0}
.si-item.active .cnt{background:var(--cnt-active-bg);color:#0071e3}
.main{flex:1;overflow-y:auto;padding:16px}

/* viewer */
.main-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.main-title{font-size:18px;font-weight:700}
.main-count{font-size:13px;color:var(--text-muted)}
.sh-badge{font-size:11px;padding:2px 7px;border-radius:7px;font-weight:700}
.bz{background:#fff0f0;color:#c0392b;border:1px solid #f5c6c6}
.bm{background:#fff8e1;color:#b8860b;border:1px solid #ffe082}
.lang-filter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.lc{padding:3px 9px;border-radius:11px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border3);background:var(--bg-panel);color:var(--text);transition:all .1s;white-space:nowrap}
.lc.active{background:#0071e3;color:#fff;border-color:#0071e3}
.lc:hover:not(.active){background:var(--bg-hover)}
.lang-block{margin-bottom:14px}
.lang-lbl{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.4px;margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid #f0f0f5}
.word-grid{display:flex;flex-wrap:wrap;gap:4px}
.wt{position:relative;display:inline-flex;align-items:center;padding:3px 8px;background:var(--bg-hover);border-radius:5px;font-size:12px;color:var(--text);border:1px solid var(--border);line-height:1.5;word-break:break-all;transition:background .1s}
.wt:hover{background:#ffe5e5;border-color:#f5c6c6}
.wt:hover .dx{opacity:1}
.dx{margin-left:4px;font-size:12px;color:#c0392b;cursor:pointer;opacity:0;transition:opacity .1s;flex-shrink:0;font-weight:700}
.wt-add{background:#f0fff4;border-color:#b7e4c7;color:#1a7a3c}
.sr-list{display:grid;gap:7px}
.sr-item{background:var(--bg-panel);border-radius:8px;padding:9px 13px;border:1px solid var(--border)}
.sr-cat{font-size:11px;color:var(--text-muted);margin-bottom:2px}
.sr-word{font-size:13px;font-weight:600}
.empty{text-align:center;padding:48px 20px;color:var(--text-muted2);font-size:14px}

/* scanner */
#scanPage{display:none;flex:1;overflow:hidden}
.scan-inner{display:flex;height:100%}
.scan-left{width:320px;flex-shrink:0;padding:14px;border-right:1px solid #e8e8ed;overflow-y:auto;background:var(--bg-panel);display:flex;flex-direction:column;gap:12px}
.scan-right{flex:1;overflow-y:auto;padding:16px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px}
.fg textarea{padding:8px 10px;border:1.5px solid var(--border3);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--bg-panel2);resize:vertical;transition:border .2s;min-height:100px}
.fg textarea:focus{border-color:#0071e3;background:var(--bg-panel)}
.drop-zone{border:2px dashed var(--border3);border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg-panel2)}
.drop-zone.drag{border-color:#0071e3;background:var(--sidebar-active)}
.drop-zone p{font-size:12px;color:var(--text-muted);margin-top:5px}
.drop-zone .dico{font-size:26px}
.file-info{font-size:12px;color:#1a7a3c;background:#f0fff4;padding:6px 10px;border-radius:6px;border:1px solid #b7e4c7;word-break:break-all}
.scope-row{display:flex;gap:7px;flex-wrap:wrap}
.scope-chip{padding:4px 10px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border3);background:var(--bg-panel);color:var(--text);transition:all .1s;user-select:none}
.scope-chip.active{background:#0071e3;color:#fff;border-color:#0071e3}
.btn-scan{padding:10px;background:#0071e3;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.btn-scan:hover{opacity:.88}
.btn-scan:disabled{background:#aeaeb2;cursor:not-allowed}
.scan-status{font-size:12px;color:var(--text-muted);min-height:16px}
.col-picker{display:flex;gap:5px;flex-wrap:wrap}
.col-chip{padding:3px 9px;border-radius:8px;font-size:12px;cursor:pointer;border:1.5px solid var(--border3);background:var(--bg-panel);color:var(--text);transition:all .1s;user-select:none}
.col-chip.active{background:#0071e3;color:#fff;border-color:#0071e3}
.res-header{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.scan-exp-wrap{position:relative;margin-left:auto}
.btn-scan-exp{padding:6px 13px;background:#0071e3;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.btn-scan-exp:hover{background:#005bbf}
.scan-exp-menu{position:absolute;top:calc(100%+5px);right:0;background:var(--exp-menu-bg);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;min-width:170px;z-index:300;display:none}
.scan-exp-menu.open{display:block}
.scan-exp-item{padding:10px 15px;font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px}
.scan-exp-item:hover{background:var(--exp-item-hover)}
.res-title{font-size:18px;font-weight:700}
.stat-chip{padding:5px 11px;border-radius:13px;font-size:12px;font-weight:700;border:1.5px solid}
.chip-hit{background:#fff0f0;color:#c0392b;border-color:#f5c6c6}
.chip-ok{background:#f0fff4;color:#1a7a3c;border-color:#b7e4c7}
.row-card{background:var(--bg-panel);border-radius:10px;padding:12px 14px;margin-bottom:9px;border:1px solid var(--border)}
.row-card.has-hit{border-left:3px solid #c0392b}
.row-meta{font-size:11px;color:var(--text-muted2);margin-bottom:5px}
.row-text{font-size:13px;line-height:1.85;word-break:break-all;white-space:pre-wrap}
mark.hit{background:#ffe5e5;color:#c0392b;border-radius:3px;padding:1px 2px;font-weight:700;cursor:pointer;position:relative}
mark.hit:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100%+4px);left:50%;transform:translateX(-50%);background:var(--tooltip-bg);color:#fff;font-size:11px;white-space:nowrap;padding:4px 8px;border-radius:5px;z-index:99;pointer-events:none;font-weight:400}
.hit-list{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.hit-tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:#fff0f0;color:#c0392b;border:1px solid #f5c6c6}
.hit-tag.min{background:#fff8e1;color:#b8860b;border-color:#ffe082}
.no-hit-row{background:var(--bg-panel);border-radius:9px;padding:9px 13px;margin-bottom:7px;border:1px solid var(--border);font-size:13px;color:var(--text-muted)}

/* ── RECORDS PAGE ── */
#recPage{display:none;flex:1;overflow:hidden;flex-direction:column}
.rec-toolbar{padding:14px 16px;background:var(--bg-panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
.rec-toolbar h2{font-size:15px;font-weight:700}
.rec-filter-row{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.rf-chip{padding:4px 11px;border-radius:11px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border3);background:var(--bg-panel);color:var(--text);transition:all .1s;user-select:none;white-space:nowrap}
.rf-chip.active{background:#0071e3;color:#fff;border-color:#0071e3}
.rf-chip:hover:not(.active){background:var(--bg-hover)}
.rec-search{padding:6px 10px;border:1.5px solid var(--border3);border-radius:9px;font-size:13px;outline:none;width:180px}
.rec-search:focus{border-color:#0071e3}
.btn-add-rec{padding:7px 13px;background:#0071e3;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-add-rec:hover{opacity:.88}
.btn-clr{padding:7px 13px;background:#fff0f0;color:#c0392b;border:1.5px solid #f5c6c6;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-clr:hover{background:#ffe5e5}
.rec-body{flex:1;overflow-y:auto;padding:14px 16px}
.rec-stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.rs-badge{padding:5px 12px;border-radius:11px;font-size:12px;font-weight:700;border:1.5px solid}
.rs-all{background:var(--bg-hover);color:var(--text);border-color:var(--border3)}
.rs-add{background:#f0fff4;color:#1a7a3c;border-color:#b7e4c7}
.rs-del{background:#fff0f0;color:#c0392b;border-color:#f5c6c6}

/* records table */
.rec-table-wrap{background:var(--bg-panel);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.rec-table{width:100%;border-collapse:collapse;font-size:13px}
.rec-table th{padding:10px 12px;background:var(--bg-hover);color:var(--text-muted);font-weight:700;font-size:11px;text-align:left;border-bottom:1.5px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
.rec-table td{padding:10px 12px;border-bottom:1px solid var(--bg-hover);vertical-align:middle}
.rec-table tr:last-child td{border-bottom:none}
.rec-table tr:hover td{background:var(--bg-panel2)}
.rt-word{font-weight:700;word-break:break-all}
.rt-word.deleted{text-decoration:line-through;color:var(--text-muted2)}
.type-add{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;background:#f0fff4;color:#1a7a3c;border:1px solid #b7e4c7}
.type-del{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;background:#fff0f0;color:#c0392b;border:1px solid #f5c6c6}
.cat-pill{display:inline-block;padding:2px 7px;border-radius:5px;background:#f0f4ff;color:#1a5fb4;border:1px solid #c0d4f7;font-size:11px}
.sheet-pill-z{display:inline-block;padding:2px 7px;border-radius:5px;background:#fff0f0;color:#c0392b;border:1px solid #f5c6c6;font-size:11px;font-weight:700}
.sheet-pill-m{display:inline-block;padding:2px 7px;border-radius:5px;background:#fff8e1;color:#b8860b;border:1px solid #ffe082;font-size:11px;font-weight:700}
.row-actions{display:flex;gap:6px;white-space:nowrap}
.act-btn{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid;transition:all .1s}
.act-edit{background:#f0f4ff;color:#1a5fb4;border-color:#c0d4f7}
.act-edit:hover{background:var(--cnt-active-bg)}
.act-undo{background:var(--bg-hover);color:var(--text);border-color:var(--border3)}
.act-undo:hover{background:#e8e8ed}
.act-del{background:#fff0f0;color:#c0392b;border-color:#f5c6c6}
.act-del:hover{background:#ffe5e5}
.rec-empty{text-align:center;padding:48px 20px;color:var(--text-muted2);font-size:14px}

/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--bg-panel);border-radius:14px;width:420px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:700}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:13px}
.mfg{display:flex;flex-direction:column;gap:5px}
.mfg label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px}
.mfg input,.mfg select,.mfg textarea{padding:8px 10px;border:1.5px solid var(--border3);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--bg-panel2);color:var(--text);transition:border .2s}
.mfg input:focus,.mfg select:focus,.mfg textarea:focus{border-color:#0071e3;background:var(--bg-panel)}
.mfg textarea{resize:vertical;min-height:80px}
.mfg .rrow{display:flex;gap:14px}
.mfg .rrow label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500}
.modal-footer{padding:14px 18px;border-top:1px solid #e8e8ed;display:flex;gap:8px;justify-content:flex-end}
.btn-cancel{padding:8px 16px;background:var(--bg-hover);border:1.5px solid var(--border3);border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.btn-cancel:hover{background:#e8e8ed}
.btn-ok{padding:8px 18px;background:#0071e3;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
.btn-ok:hover{opacity:.88}
.mfback{font-size:12px;color:#c0392b;min-height:15px}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <h1>📚 违禁词库</h1>
  <div class="page-tabs">
    <button class="ptab active" id="ptab0" onclick="switchPage(0)">📖 词库</button>
    <button class="ptab" id="ptab1" onclick="switchPage(1)">🔍 扫描</button>

const THEMES=['system','light','dark'];

  if(btn)btn.textContent=THEME_LABELS[t];

}

const SK='wl_edits_v4';
function loadEdits(){try{return JSON.parse(localStorage.getItem(SK))||{added:[],deleted:[]}}catch{return{added:[],deleted:[]}}}
function saveEdits(e){localStorage.setItem(SK,JSON.stringify(e))}
function delSet(e){return new Set(e.deleted.map(d=>d.sheet+'|'+d.cat+'|'+d.word.toLowerCase()))}

// ─── CRUD ────────────────────────────────────────
function addWordsSilent(sheet,cat,text,lang){
  const e=loadEdits(),ds=delSet(e);
  const words=text.split(/[\n\/、,]/).map(w=>w.trim()).filter(w=>w.length>=2);
  let n=0;
  for(const word of words){
    const k=sheet+'|'+cat+'|'+word.toLowerCase();
    const di=e.deleted.findIndex(d=>d.sheet+'|'+d.cat+'|'+d.word.toLowerCase()===k);
    if(di>=0){e.deleted.splice(di,1);n++;continue;}
    if(e.added.some(a=>a.sheet+'|'+a.cat+'|'+a.word.toLowerCase()===k))continue;
    const cats=DATA[sheet]||[],co=cats.find(x=>x.cat===cat);
    if(co&&co.allWords.some(w=>w.toLowerCase()===word.toLowerCase()))continue;
    e.added.push({word,sheet,cat,lang:lang||'新增',addedAt:new Date().toISOString().slice(0,10)});
    n++;
  }
  saveEdits(e);return n;
}
function deleteWord(sheet,cat,word){
  const e=loadEdits(),k=sheet+'|'+cat+'|'+word.toLowerCase();
  const ai=e.added.findIndex(a=>a.sheet+'|'+a.cat+'|'+a.word.toLowerCase()===k);
  if(ai>=0){e.added.splice(ai,1);saveEdits(e);return;}
  if(!e.deleted.some(d=>d.sheet+'|'+d.cat+'|'+d.word.toLowerCase()===k))
    e.deleted.push({word,sheet,cat,deletedAt:new Date().toISOString().slice(0,10)});
  saveEdits(e);
}
function undoByKey(type,sheet,cat,word){
  const e=loadEdits(),k=sheet+'|'+cat+'|'+word.toLowerCase();
  if(type==='deleted')e.deleted=e.deleted.filter(d=>d.sheet+'|'+d.cat+'|'+d.word.toLowerCase()!==k);
  else e.added=e.added.filter(a=>a.sheet+'|'+a.cat+'|'+a.word.toLowerCase()!==k);
  saveEdits(e);
}
function clearAllEdits(){
  if(!confirm('确定清空所有变更记录？此操作不可撤销。'))return;
  saveEdits({added:[],deleted:[]});
  refresh();
}
function handleDelete(el){
  const{sheet,cat,word}=el.dataset;
  if(!confirm('删除「'+word+'」？'))return;
  deleteWord(sheet,cat,word);refresh();
}
function refresh(){renderSidebar();renderMain();updateTopBadge();if(curPage===2)renderRecords();}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function shortLang(s){const m=s.match(/^([^（(\uff08]+)/);return(m?m[1]:s).trim().slice(0,5)}
function today(){return new Date().toISOString().slice(0,10)}

let curSheet=0,curCatIdx=0,searchQ='',activeLangs=new Set();
function switchSheet(idx){
  curSheet=idx;curCatIdx=0;activeLangs=new Set();searchQ='';
  document.getElementById('searchBox').value='';
  document.getElementById('stab0').classList.toggle('active',idx===0);
  document.getElementById('stab1').classList.toggle('active',idx===1);
  renderSidebar();renderMain();
}
function renderSidebar(){
  const cats=DATA[SHEET_NAMES[curSheet]],q=searchQ.trim().toLowerCase();
  const e=loadEdits(),ds=delSet(e),sn=SHEET_NAMES[curSheet];
  let html='';
  cats.forEach((c,i)=>{
    const dc=e.deleted.filter(d=>d.sheet===sn&&d.cat===c.cat).length;
    const ac=e.added.filter(a=>a.sheet===sn&&a.cat===c.cat).length;
    let cnt=c.allWords.length-dc+ac;
    if(q){
      cnt=c.allWords.filter(w=>!ds.has(sn+'|'+c.cat+'|'+w.toLowerCase())&&w.toLowerCase().includes(q)).length
         +e.added.filter(a=>a.sheet===sn&&a.cat===c.cat&&a.word.toLowerCase().includes(q)).length;
      if(cnt===0)return;
    }
    html+='<div class="si-item '+(i===curCatIdx?'active':'')+'" onclick="selectCat('+i+')">'
      +'<span class="si-cat">'+esc(c.cat)+'</span><span class="cnt">'+cnt+'</span></div>';
  });
  document.getElementById('sidebar').innerHTML=html||'<div style="padding:13px;color:#aeaeb2;font-size:13px">无匹配</div>';
  const tot=DATA[SHEET_NAMES[curSheet]].reduce((s,c)=>s+c.allWords.length,0);
  document.getElementById('totalBadge').textContent=cats.length+' 类 · '+tot.toLocaleString()+' 词';
}
function selectCat(idx){curCatIdx=idx;activeLangs=new Set();renderSidebar();renderMain();}
function renderMain(){
  const q=searchQ.trim().toLowerCase(),main=document.getElementById('main');
  if(q){renderSearch(q,main);return;}
  const cats=DATA[SHEET_NAMES[curSheet]],cat=cats[curCatIdx];
  if(!cat){main.innerHTML='<div class="empty">请选择类别</div>';return;}
  const e=loadEdits(),ds=delSet(e),sn=SHEET_NAMES[curSheet];
  const added=e.added.filter(a=>a.sheet===sn&&a.cat===cat.cat);
  const dc=e.deleted.filter(d=>d.sheet===sn&&d.cat===cat.cat).length;
  const bc=curSheet===0?'bz':'bm',bt=curSheet===0?'直拦词库':'敏感词库';
  let html='<div class="main-hd"><span class="main-title">'+esc(cat.cat)+'</span>'
    +'<span class="main-count">'+(cat.allWords.length-dc+added.length)+' 词</span>'
    +'<span class="sh-badge '+bc+'">'+bt+'</span>';
  if(dc>0)html+='<span class="main-count" style="color:#c0392b">−'+dc+'</span>';
  if(added.length)html+='<span class="main-count" style="color:#1a7a3c">+'+added.length+'</span>';
  html+='</div>';
  html+='<div class="lang-filter"><span class="lc '+(activeLangs.size===0?'active':'')+'" data-lang="" onclick="setLang(this)">全部</span>';
  cat.entries.forEach(en=>{html+='<span class="lc '+(activeLangs.has(en.lang)?'active':'')+'" data-lang="'+esc(en.lang)+'" onclick="setLang(this)">'+esc(shortLang(en.lang))+'</span>';});
  if(added.length)html+='<span class="lc '+(activeLangs.has('__added__')?'active':'')+'" data-lang="__added__" onclick="setLang(this)" style="color:#1a7a3c;border-color:#b7e4c7">✨ 新增</span>';
  html+='</div>';
  if(added.length&&(activeLangs.size===0||activeLangs.has('__added__'))){

// SCANNER
// ═══════════════════════════════════════════════
const LEET={'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','8':'b','@':'a','$':'s'};
const INSEP=/(?<=[A-Za-zÀ-ɏ])[-._*·](?=[A-Za-zÀ-ɏ])/gu;
function hasCJK(s){return /[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/.test(s)}
function isTiny(w){const c=w.replace(/ /g,'');return /^[A-Za-z]+$/.test(c)&&c.length<3}
function buildIndex(scopes){
  const e=loadEdits(),ds=delSet(e),entries=[];
  for(const sn of scopes){
    const cats=DATA[sn]||[];
    for(const cat of cats){
      for(const entry of cat.entries)for(const w of entry.words)if(!ds.has(sn+'|'+cat.cat+'|'+w.toLowerCase())&&!isTiny(w))entries.push({word:w,cat:cat.cat,src:sn==='直拦词库'?'直拦':'敏感'});
      for(const a of e.added.filter(x=>x.sheet===sn&&x.cat===cat.cat))if(!isTiny(a.word))entries.push({word:a.word,cat:a.cat,src:sn==='直拦词库'?'直拦':'敏感'});
    }
  }
  const seen=new Map();
  for(const en of entries){const k=en.word.toLowerCase();if(!seen.has(k))seen.set(k,en);}
  const all=[...seen.values()];
  const cjk=all.filter(e=>hasCJK(e.word));
  const nc=all.filter(e=>!hasCJK(e.word)).sort((a,b)=>b.word.length-a.word.length);
  const ncPat=nc.length?new RegExp('(?<![A-Za-z0-9])(?:'+nc.map(e=>e.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-z0-9])','gi'):null;
  const cjkPat=cjk.length?new RegExp(cjk.slice().sort((a,b)=>b.word.length-a.word.length).map(e=>{const p=e.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return /^\d/.test(e.word)?'(?<!\\d)'+p:p;}).join('|'),'g'):null;
  const w2e=new Map(all.map(e=>[e.word.toLowerCase(),e]));
  return{ncPat,cjkPat,w2e};
}
function scanOne(text,idx,doLeet,doSep){
  const{ncPat,cjkPat,w2e}=idx;
  const hits=new Map();
  function sweep(t){
    if(ncPat){ncPat.lastIndex=0;for(const m of t.matchAll(ncPat)){const k=m[0].toLowerCase();if(!hits.has(k)&&w2e.has(k))hits.set(k,w2e.get(k));}}
    if(cjkPat){cjkPat.lastIndex=0;for(const m of t.matchAll(cjkPat)){const k=m[0].toLowerCase();if(!hits.has(k)&&w2e.has(k))hits.set(k,w2e.get(k));}}
  }
  sweep(text);
  if(doLeet||doSep){let n=text;if(doSep)n=n.replace(INSEP,'');if(doLeet)n=n.replace(/[013458@$7]/g,c=>LEET[c]||c);if(n!==text)sweep(n);}
  return hits;
}
function buildHL(text,hits){
  if(!hits.size)return esc(text);
  const parts=[];
  for(const[k,en] of hits){
    if(hasCJK(en.word)){const p=en.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp(/^\d/.test(en.word)?'(?<!\\d)'+p:p,'g');for(const m of text.matchAll(re))parts.push({s:m.index,e:m.index+m[0].length,en,w:m[0]});}
    else{const re=new RegExp('(?<![A-Za-z0-9])'+en.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z0-9])','gi');for(const m of text.matchAll(re))parts.push({s:m.index,e:m.index+m[0].length,en,w:m[0]});}
  }
  parts.sort((a,b)=>a.s-b.s);
  const mg=[];for(const p of parts){if(mg.length&&p.s<mg[mg.length-1].e){if(p.e>mg[mg.length-1].e)mg[mg.length-1].e=p.e;}else mg.push({...p});}
  let out='',pos=0;
  for(const p of mg){out+=esc(text.slice(pos,p.s));out+='<mark class="hit" data-tip="'+esc(p.en.cat+'·'+p.en.src)+'">'+esc(p.w)+'</mark>';pos=p.e;}
  return out+esc(text.slice(pos));
}
let fileRows=[],fileHeaders=[],activeCols=new Set();
function onDragOver(e){e.preventDefault();document.getElementById('dropZone').classList.add('drag')}
function onDragLeave(){document.getElementById('dropZone').classList.remove('drag')}
function onDrop(e){e.preventDefault();document.getElementById('dropZone').classList.remove('drag');const f=e.dataTransfer.files[0];if(f)loadFile(f)}

function loadFile(file){
  const ext=file.name.split('.').pop().toLowerCase();
  document.getElementById('fileInfo').style.display='block';
  document.getElementById('fileInfo').textContent='⏳ 加载：'+file.name;
  if(ext==='txt'){
    const rd=new FileReader();rd.onload=ev=>{fileHeaders=[];fileRows=ev.target.result.split(/\r?\n/).filter(l=>l.trim()).map(l=>({_text:l}));activeCols=new Set(['_text']);document.getElementById('colPickerWrap').style.display='none';document.getElementById('fileInfo').textContent='✅ '+file.name+'（'+fileRows.length+' 行）';};rd.readAsText(file);
  } else if(ext==='csv'){
    // Use SheetJS for CSV so quoted multi-line fields (e.g. botPrompt) are parsed correctly
    const rd=new FileReader();rd.onload=ev=>{
      const wb=XLSX.read(ev.target.result,{type:'binary',raw:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{defval:''});
      fileRows=data;fileHeaders=data.length?Object.keys(data[0]):[];
      smartActiveCols(fileHeaders);renderColPicker();
      document.getElementById('fileInfo').textContent='✅ '+file.name+'（'+fileRows.length+' 行）';
    };rd.readAsBinaryString(file);
  } else {
    const rd=new FileReader();rd.onload=ev=>{const wb=XLSX.read(ev.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws,{defval:''});fileRows=data;fileHeaders=data.length?Object.keys(data[0]):[];smartActiveCols(fileHeaders);renderColPicker();document.getElementById('fileInfo').textContent='✅ '+file.name+'（'+fileRows.length+' 行）';};rd.readAsArrayBuffer(file);
  }
}
function parseCsvText(txt,name){
  const lines=txt.split(/\r?\n/);const heads=lines[0]?lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim()):[];
  fileHeaders=heads;fileRows=lines.slice(1).filter(l=>l.trim()).map(l=>{const vals=l.split(',').map(v=>v.replace(/^"|"$/g,'').trim());const obj={};heads.forEach((h,i)=>obj[h]=vals[i]||'');return obj;});
  smartActiveCols(fileHeaders);renderColPicker();document.getElementById('fileInfo').textContent='✅ '+name+'（'+fileRows.length+' 行）';
}
// Known scan-only cols (match Python TEXT_COLS); id/meta cols to exclude by default
const SCAN_COLS=['botTitle','botIntro','botWelcomeMessage','botPrompt'];
const ID_COLS=['promptId','id','ID','_id'];
function smartActiveCols(heads){
  const hasScan=heads.some(h=>SCAN_COLS.includes(h));
  if(hasScan){activeCols=new Set(heads.filter(h=>SCAN_COLS.includes(h)));}
  else{activeCols=new Set(heads.filter(h=>!ID_COLS.includes(h)));}
}
function renderColPicker(){const wrap=document.getElementById('colPickerWrap'),p=document.getElementById('colPicker');if(!fileHeaders.length){wrap.style.display='none';return;}wrap.style.display='block';p.innerHTML=fileHeaders.map(h=>'<span class="col-chip '+(activeCols.has(h)?'active':'')+'" onclick="toggleCol(this,\''+esc(h)+'\')">'+esc(h)+'</span>').join('');}
function toggleCol(el,col){el.classList.toggle('active');if(activeCols.has(col))activeCols.delete(col);else activeCols.add(col);}
function toggleScope(el){el.classList.toggle('active')}
let _lastScanResults=null; // {rows, results, scopes}
function runScan(){
  const scopes=[...document.querySelectorAll('.scope-chip.active[data-scope]')].map(el=>el.dataset.scope);
  if(!scopes.length){alert('请至少选一个范围');return;}
  const doLeet=document.getElementById('normLeet').classList.contains('active');
  const doSep=document.getElementById('normSep').classList.contains('active');
  const idx=buildIndex(scopes);
  const st=document.getElementById('scanStatus'),sr=document.getElementById('scanRight');
  let rows=[];
  const paste=document.getElementById('scanText').value.trim();
  if(paste){rows=paste.split(/\n/).filter(l=>l.trim()).map((l,i)=>({_id:i+1,_text:l}));}
  else if(fileRows.length){rows=fileRows.map((r,i)=>{const cols=fileHeaders.length?[...activeCols]:['_text'];const pid=r['promptId']||r['id']||'';const ttl=r['botTitle']||r['title']||'';const text=cols.map(c=>String(r[c]||'')).join(' ');const meta=(pid||ttl)?(pid?(ttl?pid+' · '+ttl:pid):(ttl)):Object.entries(r).slice(0,2).map(([k,v])=>k+'='+String(v).slice(0,30)).join(', ');return{_id:i+1,_text:text,_meta:meta,_pid:pid,_ttl:ttl}});}
  else{alert('请先粘贴文本或上传文件');return;}
  st.textContent='⏳ 扫描中…';document.getElementById('btnScan').disabled=true;
  setTimeout(()=>{
    let hitCount=0,hitRows=0;
    const results=rows.map(row=>{const hits=scanOne(row._text,idx,doLeet,doSep);if(hits.size>0){hitCount+=hits.size;hitRows++;}return{row,hits};});
    _lastScanResults={rows,results,scopes};
    let html='<div class="res-header"><span class="res-title">扫描结果</span>'
      +(hitRows>0?'<span class="stat-chip chip-hit">⚠️ '+hitRows+'/'+rows.length+' 行命中，共 '+hitCount+' 处</span>':'<span class="stat-chip chip-ok">✅ 全部干净</span>')
      +'<div class="scan-exp-wrap"><button class="btn-scan-exp" onclick="toggleScanExpMenu()">⬇️ 导出结果</button>'
      +'<div class="scan-exp-menu" id="scanExpMenu"><div class="scan-exp-item" onclick="doScanExport("json")">📄 JSON</div><div class="scan-exp-item" onclick="doScanExport("csv")">📊 CSV</div><div class="scan-exp-item" onclick="doScanExport("xlsx")">📗 Excel (.xlsx)</div></div></div>'
      +'</div>';
    results.filter(r=>r.hits.size>0).forEach(({row,hits})=>{
      html+='<div class="row-card has-hit">'+(row._meta?'<div class="row-meta">'+esc(row._meta)+'</div>':'<div class="row-meta">行 '+row._id+'</div>')
        +'<div class="row-text">'+buildHL(row._text,hits)+'</div><div class="hit-list">';
      for(const[k,en] of hits)html+='<span class="hit-tag '+(en.src==='敏感'?'min':'')+'">'+esc(en.word)+' <span style="opacity:.6;font-weight:400">'+esc(en.cat)+'</span></span>';
      html+='</div></div>';
    });
    const clean=results.filter(r=>r.hits.size===0);
    if(clean.length)html+='<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#6e6e73;padding:8px 0">▶ 未命中行（'+clean.length+'）</summary>'+clean.slice(0,200).map(({row})=>'<div class="no-hit-row"><span style="color:#aeaeb2;margin-right:8px">'+(row._meta?esc(row._meta):'行'+row._id)+'</span>'+esc(row._text.slice(0,200))+'</div>').join('')+(clean.length>200?'<div style="color:#aeaeb2;font-size:12px;padding:8px">…仅显示前200</div>':'')+'</details>';
    sr.innerHTML=html;st.textContent='✅ 完成，共 '+rows.length+' 行';document.getElementById('btnScan').disabled=false;
  },30);
}


// ─── Scan result export ───────────────────────────────────────────────────────
function toggleScanExpMenu(){
  const m=document.getElementById('scanExpMenu');
  if(m)m.classList.toggle('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.scan-exp-wrap')){
    const m=document.getElementById('scanExpMenu');
    if(m)m.classList.remove('open');
  }
});
function doScanExport(fmt){
  const m=document.getElementById('scanExpMenu');
  if(m)m.classList.remove('open');
  if(!_lastScanResults){alert('请先运行扫描');return;}
  const {rows,results}=_lastScanResults;
  const ts=new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
  const fname='扫描结果_'+ts;
  // Build flat rows: one row per hit (include clean rows too, hits='')
  const flat=results.map(({row,hits})=>{
    const pid2=row._pid||'';const ttl2=row._ttl||'';
    if(hits.size===0)return [{promptId:pid2,botTitle:ttl2,行号:row._id,扫描文本:row._text.slice(0,200),命中词:'',类别:'',词库类型:'',状态:'干净'}];
    return [...hits.values()].map(en=>({promptId:pid2,botTitle:ttl2,行号:row._id,扫描文本:row._text.slice(0,200),命中词:en.word,类别:en.cat,词库类型:en.src==='敏感'?'敏感词库':'直拦词库',状态:'命中'}));
  }).flat();
  if(fmt==='json'){
    dlBlob(new Blob([JSON.stringify(flat,null,2)],{type:'application/json'}),fname+'.json');
  } else if(fmt==='csv'){
    const hasPid=flat.some(r=>r.promptId);const hdr=(hasPid?['promptId','botTitle']:['行号']).concat(['扫描文本','命中词','类别','词库类型','状态']);
    const csvRows=[hdr.join(','),...flat.map(r=>hdr.map(k=>'"'+String(r[k]||'').replace(/"/g,'""')+'"').join(','))];
    dlBlob(new Blob(['﻿'+csvRows.join('\n')],{type:'text/csv;charset=utf-8'}),fname+'.csv');
  } else if(fmt==='xlsx'){
    if(typeof XLSX==='undefined'){alert('XLSX 库未加载');return;}
    const ws=XLSX.utils.json_to_sheet(flat);
    // Auto col width
    const cols=Object.keys(flat[0]||{});
    ws['!cols']=cols.map(k=>({wch:Math.min(60,Math.max(k.length+2,...flat.map(r=>String(r[k]||'').length+2)))}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'扫描结果');
    XLSX.writeFile(wb,fname+'.xlsx');
  }
}

// ═══════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════
function toggleExpMenu(){document.getElementById('expMenu').classList.toggle('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.exp-wrap'))document.getElementById('expMenu').classList.remove('open')});
// Build pivot: one row per category, one column per language
function buildPivotRows(){
  const e=loadEdits(),ds=delSet(e);
  const langOrder=[],langSet=new Set();
  for(const[sn,cats]of Object.entries(DATA)){
    for(const cat of cats){
      for(const entry of cat.entries)if(!langSet.has(entry.lang)){langSet.add(entry.lang);langOrder.push(entry.lang);}
      for(const a of e.added.filter(x=>x.sheet===sn&&x.cat===cat.cat)){const l=a.lang||'新增';if(!langSet.has(l)){langSet.add(l);langOrder.push(l);}}
    }
  }
  const rows=[];
  for(const[sn,cats]of Object.entries(DATA)){
    for(const cat of cats){
      const lm={};
      for(const entry of cat.entries){
        const ws=entry.words.filter(w=>!ds.has(sn+'|'+cat.cat+'|'+w.toLowerCase()));
        if(!lm[entry.lang])lm[entry.lang]=new Set();
        ws.forEach(w=>lm[entry.lang].add(w));
      }
      for(const a of e.added.filter(x=>x.sheet===sn&&x.cat===cat.cat)){
        if(ds.has(sn+'|'+cat.cat+'|'+a.word.toLowerCase()))continue;
        const l=a.lang||'新增';if(!lm[l])lm[l]=new Set();lm[l].add(a.word);
      }
      rows.push({sheet:sn,cat:cat.cat,lm});
    }
  }
  return{langOrder,rows};
}
function dlBlob(blob,name){const u=URL.createObjectURL(blob),a=Object.assign(document.createElement('a'),{href:u,download:name});document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),1000)}
function doExport(fmt){
  document.getElementById('expMenu').classList.remove('open');
  if(fmt==='json'){
    const e=loadEdits(),ds=delSet(e),m=JSON.parse(JSON.stringify(DATA));
    for(const[sn,cats]of Object.entries(m)){
      for(const cat of cats){
        cat.entries=cat.entries.map(en=>({...en,words:en.words.filter(w=>!ds.has(sn+'|'+cat.cat+'|'+w.toLowerCase()))})).filter(en=>en.words.length);
        cat.allWords=cat.allWords.filter(w=>!ds.has(sn+'|'+cat.cat+'|'+w.toLowerCase()));
        const added=e.added.filter(a=>a.sheet===sn&&a.cat===cat.cat);
        if(added.length){const bl={};added.forEach(a=>{(bl[a.lang||'新增']||(bl[a.lang||'新增']=[])).push(a.word)});for(const[l,ws]of Object.entries(bl)){const ex=cat.entries.find(en=>en.lang===l);if(ex)ex.words.push(...ws);else cat.entries.push({lang:l,words:ws})}cat.allWords.push(...added.map(a=>a.word))}
      }
    }
    dlBlob(new Blob([JSON.stringify(m,null,2)],{type:'application/json'}),'违禁词库_'+today()+'.json');
  } else if(fmt==='tsv'){
    const{langOrder,rows}=buildPivotRows();
    const sep='\t';
    const header=['词库','类型',...langOrder].join(sep);
    const lines=[header];
    for(const row of rows){
      const cells=[row.sheet,row.cat,...langOrder.map(l=>row.lm[l]?[...row.lm[l]].join(','):'')];
      lines.push(cells.join(sep));
    }
    dlBlob(new Blob(['\uFEFF'+lines.join('\n')],{type:'text/tab-separated-values;charset=utf-8'}),'违禁词库_'+today()+'.tsv');
  } else {
    if(typeof XLSX==='undefined'){alert('XLSX库加载中，稍候重试');return;}
    const{langOrder,rows}=buildPivotRows(),wb2=XLSX.utils.book_new();
    // One sheet per 词库
    for(const sn of Object.keys(DATA)){
      const snRows=rows.filter(r=>r.sheet===sn);
      const aoa=[['类型',...langOrder]];
      for(const row of snRows){
        aoa.push([row.cat,...langOrder.map(l=>row.lm[l]?[...row.lm[l]].join(', '):'')]);
      }
      const ws2=XLSX.utils.aoa_to_sheet(aoa);
      const colW=[{wch:22},...langOrder.map(()=>({wch:30}))];
      ws2['!cols']=colW;
      XLSX.utils.book_append_sheet(wb2,ws2,sn.slice(0,31));
    }
    XLSX.writeFile(wb2,'违禁词库_'+today()+'.xlsx');
  }
}
