<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f0f0f5;color:#1d1d1f;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* topbar */
.topbar{background:#1d1d1f;color:#f5f5f7;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;z-index:10}
.topbar h1{font-size:15px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tab-btn{padding:5px 14px;border-radius:16px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.12);color:#f5f5f7;transition:all .15s}
.tab-btn.active{background:#0071e3;color:#fff}
.tab-btn:hover:not(.active){background:rgba(255,255,255,.22)}
.search-wrap{flex:1;min-width:120px;max-width:260px;position:relative}
.search-wrap input{width:100%;padding:6px 10px 6px 28px;border-radius:16px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:13px;outline:none}
.search-wrap input::placeholder{color:rgba(255,255,255,.4)}
.search-wrap input:focus{background:rgba(255,255,255,.25)}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}
.tb-spacer{flex:1}
.total-badge{font-size:12px;color:rgba(255,255,255,.4);white-space:nowrap}
.tb-btn{padding:6px 13px;border-radius:7px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:#f5f5f7;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-btn.accent{background:#0071e3;border-color:#0071e3}
.tb-btn.accent:hover{background:#005bbf}
.exp-wrap{position:relative}
.exp-menu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;min-width:170px;z-index:300;display:none}
.exp-menu.open{display:block}
.exp-item{padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;color:#1d1d1f;white-space:nowrap}
.exp-item:hover{background:#f5f5f7}

/* layout */
.body{display:flex;flex:1;overflow:hidden;position:relative}

/* sidebar */
.sidebar{width:220px;flex-shrink:0;background:#fff;border-right:1px solid #e0e0e8;overflow-y:auto;padding:6px 0}
.si-item{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent;transition:background .12s}
.si-item:hover{background:#f5f5f7}
.si-item.active{background:#eef4ff;border-left-color:#0071e3}
.si-cat{font-size:13px;font-weight:500;flex:1;margin-right:6px;word-break:break-all;line-height:1.4}
.si-item.active .si-cat{color:#0071e3;font-weight:700}
.cnt-badge{font-size:11px;color:#aeaeb2;background:#f5f5f7;padding:2px 5px;border-radius:8px;flex-shrink:0}
.si-item.active .cnt-badge{background:#dce9ff;color:#0071e3}

/* main */
.main{flex:1;overflow-y:auto;padding:18px}
.main-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.main-title{font-size:19px;font-weight:700}
.main-count{font-size:13px;color:#6e6e73}
.sh-badge{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:700}
.bz{background:#fff0f0;color:#c0392b;border:1px solid #f5c6c6}
.bm{background:#fff8e1;color:#b8860b;border:1px solid #ffe082}
.lang-filter{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.lc{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid #d2d2d7;background:#fff;color:#1d1d1f;transition:all .12s;white-space:nowrap}
.lc.active{background:#0071e3;color:#fff;border-color:#0071e3}
.lc:hover:not(.active){background:#f5f5f7}
.lang-block{margin-bottom:16px}
.lang-lbl{font-size:11px;font-weight:700;color:#6e6e73;letter-spacing:.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #f0f0f5}
.word-grid{display:flex;flex-wrap:wrap;gap:5px}

/* word tag */
.wt{position:relative;display:inline-flex;align-items:center;padding:3px 8px;background:#f5f5f7;border-radius:5px;font-size:12px;color:#1d1d1f;border:1px solid #e8e8ed;line-height:1.5;word-break:break-all;cursor:default;transition:background .12s}
.wt:hover{background:#ffe5e5;border-color:#f5c6c6}
.wt:hover .dx{opacity:1}
.dx{margin-left:5px;font-size:13px;color:#c0392b;cursor:pointer;opacity:0;transition:opacity .12s;line-height:1;flex-shrink:0;font-weight:700}
.dx:hover{color:#900}
.wt-add{background:#f0fff4;border-color:#b7e4c7;color:#1a7a3c}
.wt-add:hover{background:#ffe5e5;border-color:#f5c6c6}

/* search */
.sr-list{display:grid;gap:8px}
.sr-item{background:#fff;border-radius:8px;padding:10px 14px;border:1px solid #e8e8ed}
.sr-cat{font-size:11px;color:#6e6e73;margin-bottom:3px}
.sr-word{font-size:14px;font-weight:600}
.empty{text-align:center;padding:48px 20px;color:#aeaeb2;font-size:14px}

/* overlay + drawer */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:150}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:-440px;width:420px;height:100vh;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:160;display:flex;flex-direction:column;transition:right .28s cubic-bezier(.4,0,.2,1)}
.drawer.open{right:0}
.dr-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #e8e8ed;flex-shrink:0}
.dr-title{font-size:15px;font-weight:700}
.cl-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#aeaeb2;padding:2px 6px;border-radius:5px}
.cl-btn:hover{background:#f5f5f7;color:#1d1d1f}
.dr-tabs{display:flex;border-bottom:1px solid #e8e8ed;flex-shrink:0}
.dtab{flex:1;padding:10px;border:none;background:none;font-size:13px;font-weight:600;cursor:pointer;color:#6e6e73;border-bottom:2px solid transparent;transition:all .15s}
.dtab.active{color:#0071e3;border-bottom-color:#0071e3}
.dtab:hover:not(.active){color:#1d1d1f;background:#f5f5f7}
.log-badge{display:inline-block;background:#ff3b30;color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle;font-weight:700}
.dpanel{flex:1;overflow-y:auto;padding:16px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:700;color:#6e6e73;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border:1.5px solid #d2d2d7;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fafafa;color:#1d1d1f;transition:border .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#0071e3;background:#fff}
.fg textarea{resize:vertical;min-height:90px}
.radio-row{display:flex;gap:16px}
.radio-row label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;cursor:pointer}
.btn-pri{width:100%;padding:10px;background:#0071e3;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.btn-pri:hover{opacity:.88}
.btn-dng{padding:8px 16px;background:#fff0f0;color:#c0392b;border:1.5px solid #f5c6c6;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.btn-dng:hover{background:#ffe5e5}
.fback{margin-top:8px;font-size:13px;min-height:18px}
.log-sec{font-size:11px;font-weight:700;color:#6e6e73;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 8px}
.log-item{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #f5f5f7}
.log-word{font-size:13px;font-weight:600;display:block;margin-bottom:2px;word-break:break-all}
.log-meta{font-size:11px;color:#aeaeb2}
.undo-btn{flex-shrink:0;padding:4px 10px;background:#f5f5f7;border:1px solid #d2d2d7;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.undo-btn:hover{background:#e8e8ed}
.log-del .log-word{text-decoration:line-through;color:#aeaeb2}
.log-add .log-word{color:#1a7a3c}
</style>
</head>
<body>

<div class="topbar">
  <h1>📚 违禁词库</h1>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchSheet(0)" id="tab0">直拦词库</button>

  </div>
  <div class="search-wrap">
    <span class="si">🔍</span>
    <input id="searchBox" type="text" placeholder="搜索词…" oninput="onSearch(this.value)">

  <div class="tb-spacer"></div>
  <span class="total-badge" id="totalBadge"></span>
  <button class="tb-btn accent" onclick="toggleDrawer()">✏️ 编辑词库</button>
  <div class="exp-wrap">
    <button class="tb-btn" id="expBtn" onclick="toggleExpMenu()">⬇️ 导出</button>

      <div class="exp-item" onclick="doExport('xlsx')">📗 导出 Excel (.xlsx)</div>
    </div>
  </div>
</div>

<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

<div class="drawer" id="drawer">
  <div class="dr-hd">
    <span class="dr-title">✏️ 编辑词库</span>
    <button class="cl-btn" onclick="toggleDrawer()">✕</button>
  </div>
  <div class="dr-tabs">
    <button class="dtab active" id="dtab0" onclick="switchDTab(0)">➕ 新增词</button>
    <button class="dtab" id="dtab1" onclick="switchDTab(1)">📋 变更记录<span class="log-badge" id="logBadge" style="display:none">0</span></button>

  <div id="dPanel0" class="dpanel">
    <div class="fg">
      <label>目标词库</label>
      <div class="radio-row">
        <label><input type="radio" name="fSheet" value="直拦词库" checked> 直拦词库</label>
        <label><input type="radio" name="fSheet" value="敏感词库"> 敏感词库</label>
      </div>
    </div>
    <div class="fg">
      <label>类别</label>
      <select id="fCat"></select>
    </div>
    <div class="fg" id="newCatWrap" style="display:none">
      <label>新类别名称</label>
      <input id="fNewCat" type="text" placeholder="输入新类别名称…">
    </div>
    <div class="fg">
      <label>语种标注 <span style="font-weight:400;text-transform:none;letter-spacing:0">（可选，留空标记为"新增"）</span></label>
      <input id="fLang" type="text" placeholder="例：英语 English">
    </div>
    <div class="fg">
      <label>词语 <span style="font-weight:400;text-transform:none;letter-spacing:0">每行一个，或用 /、 分隔</span></label>
      <textarea id="fWords" placeholder="每行输入一个词…"></textarea>
    </div>
    <button class="btn-pri" onclick="submitAdd()">✅ 添加</button>
    <div class="fback" id="addFb"></div>
  </div>

  <div id="dPanel1" class="dpanel" style="display:none">
    <div id="logList"></div>
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #f5f5f7">
      <button class="btn-dng" onclick="clearAllEdits()">🗑 清空所有变更记录</button>
    </div>
  </div>
</div>

  let html='';
  cats.forEach((c,i)=>{
    const delC=edits.deleted.filter(d=>d.sheet===sn&&d.cat===c.cat).length;
    const addC=edits.added.filter(a=>a.sheet===sn&&a.cat===c.cat).length;
    let cnt=c.allWords.length-delC+addC;
    if(q){
      cnt=c.allWords.filter(w=>!ds.has(sn+'|'+c.cat+'|'+w.toLowerCase())&&w.toLowerCase().includes(q)).length
         +edits.added.filter(a=>a.sheet===sn&&a.cat===c.cat&&a.word.toLowerCase().includes(q)).length;
      if(cnt===0)return;
    }
    const active=i===curCatIdx?'active':'';
    html+='<div class="si-item '+active+'" onclick="selectCat('+i+')">'
      +'<span class="si-cat">'+esc(c.cat)+'</span>'
      +'<span class="cnt-badge">'+cnt+'</span></div>';
  });
  document.getElementById('sidebar').innerHTML=html||'<div style="padding:14px;color:#aeaeb2;font-size:13px">无匹配</div>';
  const tot=DATA[SHEET_NAMES[curSheet]].reduce((s,c)=>s+c.allWords.length,0);
  document.getElementById('totalBadge').textContent=cats.length+' 类 · '+tot.toLocaleString()+' 词';
}

function selectCat(idx){curCatIdx=idx;activeLangs=new Set();renderSidebar();renderMain();}

// ── Render main ───────────────────────────────────────────
function renderMain(){
  const q=searchQ.trim().toLowerCase(),main=document.getElementById('main');
  if(q){renderSearch(q,main);return;}
  const cats=DATA[SHEET_NAMES[curSheet]],cat=cats[curCatIdx];
  if(!cat){main.innerHTML='<div class="empty">请选择类别</div>';return;}
  const edits=loadEdits(),ds=delSet(edits),sn=SHEET_NAMES[curSheet];
  const addedFC=edits.added.filter(a=>a.sheet===sn&&a.cat===cat.cat);
  const delC=edits.deleted.filter(d=>d.sheet===sn&&d.cat===cat.cat).length;
  const dispCnt=cat.allWords.length-delC+addedFC.length;
  const bc=curSheet===0?'bz':'bm',bt=curSheet===0?'直拦词库':'敏感词库';

  let html='<div class="main-hd">'
    +'<span class="main-title">'+esc(cat.cat)+'</span>'
    +'<span class="main-count">'+dispCnt+' 词</span>'
    +'<span class="sh-badge '+bc+'">'+bt+'</span>';
  if(delC>0) html+='<span class="main-count" style="color:#c0392b">−'+delC+' 已删</span>';
  if(addedFC.length>0) html+='<span class="main-count" style="color:#1a7a3c">+'+addedFC.length+' 新增</span>';
  html+='</div>';

  // lang chips
  html+='<div class="lang-filter"><span class="lc '+(activeLangs.size===0?'active':'')+'" data-lang="" onclick="setLang(this)">全部</span>';
  cat.entries.forEach(e=>{
    const a=activeLangs.has(e.lang)?'active':'';
    html+='<span class="lc '+a+'" data-lang="'+esc(e.lang)+'" onclick="setLang(this)">'+esc(shortLang(e.lang))+'</span>';
  });
  if(addedFC.length>0){
    const a=activeLangs.has('__added__')?'active':'';
    html+='<span class="lc '+a+'" data-lang="__added__" onclick="setLang(this)" style="color:#1a7a3c;border-color:#b7e4c7">✨ 新增</span>';
  }
  html+='</div>';

  // added words
  if(addedFC.length>0&&(activeLangs.size===0||activeLangs.has('__added__'))){
    html+='<div class="lang-block"><div class="lang-lbl" style="color:#1a7a3c">✨ 新增词</div><div class="word-grid">';
    addedFC.forEach(a=>{
      const d='data-sheet="'+esc(sn)+'" data-cat="'+esc(cat.cat)+'" data-word="'+esc(a.word)+'"';
      html+='<span class="wt wt-add" '+d+'>'+esc(a.word)+'<span class="dx" onclick="handleDelete(this.parentElement)">×</span></span>';
    });
    html+='</div></div>';
  }

  // original words by lang
  const showOrig=activeLangs.size===0||[...activeLangs].some(l=>l!=='__added__');
  if(showOrig){
    cat.entries.forEach(entry=>{
      if(activeLangs.size>0&&!activeLangs.has(entry.lang))return;
      const vis=entry.words.filter(w=>!ds.has(sn+'|'+cat.cat+'|'+w.toLowerCase()));
      if(!vis.length)return;
      html+='<div class="lang-block"><div class="lang-lbl">'+esc(entry.lang)+'</div><div class="word-grid">';
      vis.forEach(w=>{
        const d='data-sheet="'+esc(sn)+'" data-cat="'+esc(cat.cat)+'" data-word="'+esc(w)+'"';
        html+='<span class="wt" '+d+'>'+esc(w)+'<span class="dx" onclick="handleDelete(this.parentElement)">×</span></span>';
      });
      html+='</div></div>';
    });
  }

  if(!html.includes('class="wt"')&&!html.includes('wt-add')) html+='<div class="empty">该类别暂无词语</div>';
  main.innerHTML=html;
}

function renderSearch(q,main){
  const sn=SHEET_NAMES[curSheet],edits=loadEdits(),ds=delSet(edits);
  const qEsc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  let results=[];
  DATA[sn].forEach(c=>{
    c.allWords.forEach(w=>{if(!ds.has(sn+'|'+c.cat+'|'+w.toLowerCase())&&w.toLowerCase().includes(q))results.push({word:w,cat:c.cat,added:false});});
    edits.added.filter(a=>a.sheet===sn&&a.cat===c.cat).forEach(a=>{if(a.word.toLowerCase().includes(q))results.push({word:a.word,cat:a.cat,added:true});});
  });
  if(!results.length){main.innerHTML='<div class="empty">未找到含「'+esc(q)+'」的词</div>';return;}
  const re=new RegExp(qEsc,'gi');
  let html='<div class="main-hd"><span class="main-title">搜索结果</span><span class="main-count">'+results.length+' 条含「'+esc(q)+'」</span></div><div class="sr-list">';
  results.slice(0,500).forEach(r=>{
    const hl=esc(r.word).replace(re,m=>'<b style="color:#c0392b">'+m+'</b>');
    const addSt=r.added?' style="background:#f0fff4;border-color:#b7e4c7"':'';
    html+='<div class="sr-item"'+addSt+'><div class="sr-cat">'+esc(r.cat)+(r.added?' · <span style="color:#1a7a3c">新增</span>':'')+'</div><div class="sr-word">'+hl+'</div></div>';
  });
  if(results.length>500)html+='<div class="empty" style="padding:12px">仅显示前 500 条</div>';
  main.innerHTML=html+'</div>';
}

function setLang(el){
  const lang=el.dataset.lang;
  if(!lang){activeLangs=new Set();}
  else{if(activeLangs.has(lang))activeLangs.delete(lang);else activeLangs.add(lang);}
  renderMain();
}
function onSearch(v){searchQ=v;curCatIdx=0;renderSidebar();renderMain();}

// ── Drawer ────────────────────────────────────────────────
function toggleDrawer(){
  drawerOpen=!drawerOpen;
  document.getElementById('drawer').classList.toggle('open',drawerOpen);
  document.getElementById('overlay').classList.toggle('open',drawerOpen);
  if(drawerOpen){updateCatOptions();updateLogBadge();renderLog();}
}
function switchDTab(idx){
  curDTab=idx;
  document.getElementById('dtab0').classList.toggle('active',idx===0);
  document.getElementById('dtab1').classList.toggle('active',idx===1);
  document.getElementById('dPanel0').style.display=idx===0?'block':'none';
  document.getElementById('dPanel1').style.display=idx===1?'block':'none';
  if(idx===1)renderLog();
}

function updateCatOptions(){
  const sheet=document.querySelector('input[name="fSheet"]:checked').value;
  const cats=DATA[sheet]||[],edits=loadEdits();
  const newCats=[...new Set(edits.added.filter(a=>a.sheet===sheet&&!cats.find(c=>c.cat===a.cat)).map(a=>a.cat))];
  const sel=document.getElementById('fCat');
  sel.innerHTML=cats.map(c=>'<option value="'+esc(c.cat)+'">'+esc(c.cat)+' ('+c.allWords.length+'词)</option>').join('')
    +newCats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+' (新建)</option>').join('')
    +'<option value="__new__">➕ 创建新类别…</option>';
  sel.onchange=()=>document.getElementById('newCatWrap').style.display=sel.value==='__new__'?'block':'none';
}

document.querySelectorAll('input[name="fSheet"]').forEach(r=>r.addEventListener('change',updateCatOptions));

function submitAdd(){
  const sheet=document.querySelector('input[name="fSheet"]:checked').value;
  const sel=document.getElementById('fCat');
  const cat=sel.value==='__new__'?document.getElementById('fNewCat').value.trim():sel.value;
  const lang=document.getElementById('fLang').value.trim();
  const text=document.getElementById('fWords').value;
  const fb=document.getElementById('addFb');
  if(!cat){fb.textContent='❌ 请输入类别名称';fb.style.color='#c0392b';return;}
  if(!text.trim()){fb.textContent='❌ 请输入词语';fb.style.color='#c0392b';return;}
  const n=addWords(sheet,cat,text,lang);
  if(n>0){fb.textContent='✅ 成功添加 '+n+' 个词';fb.style.color='#1a7a3c';document.getElementById('fWords').value='';document.getElementById('fNewCat').value='';document.getElementById('newCatWrap').style.display='none';}
  else{fb.textContent='⚠️ 词语已存在或格式有误';fb.style.color='#b8860b';}
  setTimeout(()=>fb.textContent='',3000);
  updateCatOptions();renderSidebar();renderMain();updateLogBadge();renderLog();
}

function updateLogBadge(){
  const edits=loadEdits(),n=edits.added.length+edits.deleted.length;
  const b=document.getElementById('logBadge');
  b.textContent=n;b.style.display=n>0?'inline-block':'none';
}

function renderLog(){
  const edits=loadEdits(),ll=document.getElementById('logList');
  if(!ll)return;
  if(!edits.added.length&&!edits.deleted.length){ll.innerHTML='<div class="empty" style="padding:32px 0">暂无变更记录</div>';return;}
  let html='';
  if(edits.added.length){
    html+='<div class="log-sec">✨ 已新增 ('+edits.added.length+')</div>';
    [...edits.added].reverse().forEach(a=>{
      html+='<div class="log-item log-add">'
        +'<div><span class="log-word">'+esc(a.word)+'</span>'
        +'<span class="log-meta">'+esc(a.cat)+' · '+esc(a.sheet.replace('词库',''))+' · '+(a.addedAt||'')+'</span></div>'
        +'<button class="undo-btn" data-type="added" data-sheet="'+esc(a.sheet)+'" data-cat="'+esc(a.cat)+'" data-word="'+esc(a.word)+'" onclick="undoChange(this)">↩ 撤销</button>'
        +'</div>';
    });
  }
  if(edits.deleted.length){
    html+='<div class="log-sec" style="margin-top:14px">🗑 已删除 ('+edits.deleted.length+')</div>';
    [...edits.deleted].reverse().forEach(d=>{
      html+='<div class="log-item log-del">'
        +'<div><span class="log-word">'+esc(d.word)+'</span>'
        +'<span class="log-meta">'+esc(d.cat)+' · '+esc(d.sheet.replace('词库',''))+' · '+(d.deletedAt||'')+'</span></div>'
        +'<button class="undo-btn" data-type="deleted" data-sheet="'+esc(d.sheet)+'" data-cat="'+esc(d.cat)+'" data-word="'+esc(d.word)+'" onclick="undoChange(this)">↩ 恢复</button>'
        +'</div>';
    });
  }
  ll.innerHTML=html;
}

// ── Export ────────────────────────────────────────────────
function toggleExpMenu(){document.getElementById('expMenu').classList.toggle('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.exp-wrap'))document.getElementById('expMenu').classList.remove('open');});

function doExport(fmt){
  document.getElementById('expMenu').classList.remove('open');
  if(fmt==='json')exportJSON();else if(fmt==='csv')exportCSV();else exportXLSX();
}

function getMergedFlat(){
  const edits=loadEdits(),ds=delSet(edits),rows=[];
  for(const[sn,cats]of Object.entries(DATA)){
    for(const cat of cats){
      for(const e of cat.entries)for(const w of e.words)if(!ds.has(sn+'|'+cat.cat+'|'+w.toLowerCase()))rows.push({sheet:sn,cat:cat.cat,word:w,lang:e.lang,source:'原始',addedAt:''});
      for(const a of edits.added.filter(x=>x.sheet===sn&&x.cat===cat.cat))rows.push({sheet:sn,cat:cat.cat,word:a.word,lang:a.lang||'新增',source:'新增',addedAt:a.addedAt||''});
    }
    const nc=[...new Set(edits.added.filter(a=>a.sheet===sn&&!cats.find(c=>c.cat===a.cat)).map(a=>a.cat))];
    for(const cn of nc)for(const a of edits.added.filter(a=>a.sheet===sn&&a.cat===cn))rows.push({sheet:sn,cat:cn,word:a.word,lang:a.lang||'新增',source:'新增',addedAt:a.addedAt||''});
  }
  return rows;
}

function dlBlob(blob,name){
  const url=URL.createObjectURL(blob),a=Object.assign(document.createElement('a'),{href:url,download:name});
  document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function exportJSON(){
  const edits=loadEdits(),ds=delSet(edits),merged=JSON.parse(JSON.stringify(DATA));
  for(const[sn,cats]of Object.entries(merged)){
    for(const cat of cats){
      cat.entries=cat.entries.map(e=>({...e,words:e.words.filter(w=>!ds.has(sn+'|'+cat.cat+'|'+w.toLowerCase()))})).filter(e=>e.words.length);
      cat.allWords=cat.allWords.filter(w=>!ds.has(sn+'|'+cat.cat+'|'+w.toLowerCase()));
      const added=edits.added.filter(a=>a.sheet===sn&&a.cat===cat.cat);
      if(added.length){
        const bl={};added.forEach(a=>{(bl[a.lang||'新增']||(bl[a.lang||'新增']=[])).push(a.word);});
        for(const[l,ws]of Object.entries(bl)){const ex=cat.entries.find(e=>e.lang===l);if(ex)ex.words.push(...ws);else cat.entries.push({lang:l,words:ws});}
        cat.allWords.push(...added.map(a=>a.word));
      }
    }
    const nc=[...new Set(edits.added.filter(a=>a.sheet===sn&&!cats.find(c=>c.cat===a.cat)).map(a=>a.cat))];
    for(const cn of nc){const ws=edits.added.filter(a=>a.sheet===sn&&a.cat===cn);const bl={};ws.forEach(a=>{(bl[a.lang||'新增']||(bl[a.lang||'新增']=[])).push(a.word);});cats.push({cat:cn,entries:Object.entries(bl).map(([l,words])=>({lang:l,words})),allWords:ws.map(a=>a.word)});}
  }
  dlBlob(new Blob([JSON.stringify(merged,null,2)],{type:'application/json'}),'违禁词库_'+today()+'.json');
}

function exportCSV(){
  const flat=getMergedFlat();
  const rows=[['词库','类别','词','语种','来源','添加日期']].concat(flat.map(r=>[r.sheet,r.cat,r.word,r.lang,r.source,r.addedAt]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  dlBlob(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),'违禁词库_'+today()+'.csv');
}

function exportXLSX(){
  if(typeof XLSX==='undefined'){alert('Excel 库加载中，请稍候再试');return;}
  const edits=loadEdits(),ds=delSet(edits),wb=XLSX.utils.book_new();
  for(const sn of Object.keys(DATA)){
    const rows=[['类别','词','语种','来源']],cats=DATA[sn];
    for(const cat of cats){
      for(const e of cat.entries)for(const w of e.words)if(!ds.has(sn+'|'+cat.cat+'|'+w.toLowerCase()))rows.push([cat.cat,w,e.lang,'原始']);
      for(const a of edits.added.filter(x=>x.sheet===sn&&x.cat===cat.cat))rows.push([cat.cat,a.word,a.lang||'新增','新增']);
    }
    const nc=[...new Set(edits.added.filter(a=>a.sheet===sn&&!cats.find(c=>c.cat===a.cat)).map(a=>a.cat))];
    for(const cn of nc)for(const a of edits.added.filter(a=>a.sheet===sn&&a.cat===cn))rows.push([cn,a.word,a.lang||'新增','新增']);
    const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:20},{wch:35},{wch:22},{wch:6}];
    XLSX.utils.book_append_sheet(wb,ws,sn.slice(0,31));
  }
  XLSX.writeFile(wb,'违禁词库_'+today()+'.xlsx');
}

// ── Init ──────────────────────────────────────────────────
renderSidebar();renderMain();
</script>
